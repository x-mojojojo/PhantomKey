AutoName: PhantomKey
Description: |
  PhantomKey is a stateless password manager for Android.

  Nothing is stored. The same inputs always produce the same outputs.

  It is an independent free-software implementation of the Master Password
  algorithm (v3). Your site passwords are deterministically derived from your
  full name, master password, site name, a counter, and a password type
  template.

  Because derivation is pure and deterministic, there is no vault to sync,
  back up, or breach.

  Features:
  * Instant generation — type a site name; password and login name appear
    with no "Generate" button
  * Password types — Maximum, Long, Medium, Basic, Short, PIN, Name, Phrase
  * Counter — rotate a site password without changing your master key
  * Deterministic login names — unique username per site
  * Clipboard auto-clear — copied secrets expire after a configurable delay
  * Session timeout — auto-lock after inactivity
  * Biometric unlock — optional fingerprint / face unlock (Android Keystore)
  * Site history — local metadata only (never passwords)
  * Import / export — JSON backup of site metadata

