name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  release:
    name: Build and release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > phantomkey-release.keystore

      - name: Verify algorithm vectors
        run: python3 scripts/verify_vectors.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        env:
          SOURCE_DATE_EPOCH: 0
        run: ./gradlew assembleRelease --stacktrace

      - name: Normalize APK (reproducible build)
        run: |
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          # Move to unsigned if Gradle named it with -unsigned suffix
          for apk in app/build/outputs/apk/release/*.apk; do
            cp "$apk" unsigned.apk
          done
          # Strip timestamps: touch all entries with epoch 0
          python3 -c "
          import zipfile, os, io
          src = 'unsigned.apk'
          dst = 'normalized.apk'
          with zipfile.ZipFile(src, 'r') as zin:
              with zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      buf = zin.read(item.filename)
                      item.date_time = (1980, 1, 1, 0, 0, 0)
                      zout.writestr(item, buf)
          "

      - name: Zipalign
        run: |
          $ANDROID_HOME/build-tools/*/zipalign -f -v 4 normalized.apk aligned.apk

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/*/apksigner sign \
            --ks phantomkey-release.keystore \
            --ks-pass pass:phantomkey \
            --ks-key-alias phantomkey \
            --key-pass pass:phantomkey \
            aligned.apk
          mv aligned.apk PhantomKey-${{ github.event.inputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: PhantomKey v${{ github.event.inputs.version }}
          files: PhantomKey-${{ github.event.inputs.version }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
