name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  release:
    name: Build and release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify version matches build.gradle
        run: |
          GRADLE_VER=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[0-9.]+"' | tr -d '"')
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ "$GRADLE_VER" != "$INPUT_VER" ]; then
            echo "Mismatch: build.gradle.kts versionName=$GRADLE_VER but input=$INPUT_VER"
            exit 1
          fi
          echo "Version $GRADLE_VER verified"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > phantomkey-release.keystore

      - name: Verify algorithm vectors
        run: python3 scripts/verify_vectors.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Normalize APK (reproducible build)
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned.apk
          python3 -c "
          import zipfile
          with zipfile.ZipFile('unsigned.apk', 'r') as zin:
              with zipfile.ZipFile('normalized.apk', 'w', zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      buf = zin.read(item.filename)
                      item.date_time = (1980, 1, 1, 0, 0, 0)
                      zout.writestr(item, buf)
          "

      - name: Zipalign
        run: |
          $ANDROID_HOME/build-tools/*/zipalign -f -v 4 normalized.apk aligned.apk

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          $ANDROID_HOME/build-tools/*/apksigner sign \
            --ks phantomkey-release.keystore \
            --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            aligned.apk

      - name: Cleanup keystore
        if: always()
        run: rm -f phantomkey-release.keystore

      - name: Rename APK
        run: mv aligned.apk PhantomKey-${{ github.event.inputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: PhantomKey v${{ github.event.inputs.version }}
          files: PhantomKey-${{ github.event.inputs.version }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
