name: Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          build-tools: 34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Verify version matches build.gradle
        run: |
          eval "$(./gradlew printVersion -q)"
          if [ "$versionName" != "$VERSION" ]; then
            echo "Mismatch: build.gradle.kts versionName=$versionName but tag=$VERSION"
            exit 1
          fi
          echo "versionName=$versionName  versionCode=$versionCode  commit=$GITHUB_SHA"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > phantomkey-release.keystore

      - name: Verify algorithm vectors
        run: python3 scripts/verify_vectors.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Zipalign
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            aligned.apk

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks phantomkey-release.keystore \
            --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            aligned.apk

      - name: Print signing certificate fingerprint
        run: |
          echo "--- Signing certificate fingerprint ---"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs aligned.apk

      - name: Cleanup keystore
        if: always()
        run: rm -f phantomkey-release.keystore

      - name: Rename APK for release
        run: mv aligned.apk PhantomKey-${{ env.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PhantomKey v${{ env.VERSION }}
          files: PhantomKey-${{ env.VERSION }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
